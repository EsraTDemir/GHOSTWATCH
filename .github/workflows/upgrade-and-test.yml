name: Upgrade dependencies and run tests

on:
  workflow_dispatch: {}

jobs:
  upgrade-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install and upgrade requirements
        run: |
          if [ -f requirements.txt ]; then
            echo "Found requirements.txt — upgrading packages"
            pip install --upgrade -r requirements.txt || true
          else
            echo "No requirements.txt found"
          fi

      - name: Run tests (if any)
        run: |
          if [ -f requirements.txt ]; then
            # Install pytest if tests exist
            if ls test* 1>/dev/null 2>&1 || [ -f pytest.ini ] || [ -d tests ]; then
              python -m pip install pytest
              pytest -q
            else
              echo "No tests detected"
            fi
          else
            echo "No requirements.txt — skipping test discovery"
          fi
