name: GhostWatch daily
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ghostwatch.py
      - name: Save the diary
        run: |
          git config user.name "ghostwatch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add jobs.db latest_report.txt
          git commit -m "daily watch $(date -u +%F)" || echo "nothing new"
          git push
