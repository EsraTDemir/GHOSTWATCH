name: GhostWatch daily
on:
  push:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wake the robot inside the notebook
        run: |
          python -c "import json; nb=json.load(open('GhostWatch.ipynb')); src=[c['source'] for c in nb['cells'] if c['cell_type']=='code'][0]; open('gw.py','w').write(src if isinstance(src,str) else ''.join(src))"
          python gw.py
      - name: Save the diary
        run: |
          git config user.name "ghostwatch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add GhostWatch/
          git commit -m "daily watch $(date -u +%F)" || echo "nothing new"
          git push
